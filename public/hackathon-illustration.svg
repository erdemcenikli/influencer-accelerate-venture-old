  <!-- Trophy -->
  <path d="M400 150 L420 150 L420 180 L430 200 L370 200 L380 180 L380 150 Z" fill="#FBBF24" />
  <rect x="390" y="200" width="20" height="30" rx="2" fill="#FBBF24" />
  <rect x="380" y="230" width="40" height="10" rx="2" fill="#FBBF24" />
  
  <!-- Singapore skyline silhouette -->
  <path d="M0 500 L50 500 L70 480 L90 500 L120 470 L150 490 L180 460 L200 500 L230 480 L260 500 L290 470 L320 500 L350 480 L380 500 L410 470 L440 500 L470 480 L500 500 L530 470 L560 500 L590 480 L620 500 L650 470 L680 500 L710 480 L740 500 L770 480 L800 500 L800 600 L0 600 Z" fill="#4C1D95" opacity="0.2" />
  
  <!-- Text elements -->
  <rect x="250" y="100" width="300" height="40" rx="5" fill="#6D28D9" opacity="0.1" />
  <rect x="300" y="420" width="200" height="30" rx="5" fill="#6D28D9" opacity="0.1" />
