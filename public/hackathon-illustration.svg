<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#F9FAFB" />
  
  <!-- Decorative elements -->
  <circle cx="400" cy="300" r="200" fill="#EDE9FE" />
  <circle cx="400" cy="300" r="150" fill="#DDD6FE" />
  
  <!-- Laptop -->
  <rect x="300" y="250" width="200" height="120" rx="10" fill="#4C1D95" />
  <rect x="290" y="370" width="220" height="10" rx="5" fill="#4C1D95" />
  <rect x="310" y="260" width="180" height="100" rx="2" fill="#C4B5FD" />
  
  <!-- Code on screen -->
  <rect x="320" y="270" width="160" height="10" rx="2" fill="#8B5CF6" opacity="0.7" />
  <rect x="320" y="285" width="140" height="10" rx="2" fill="#8B5CF6" opacity="0.7" />
  <rect x="320" y="300" width="120" height="10" rx="2" fill="#8B5CF6" opacity="0.7" />
  <rect x="320" y="315" width="150" height="10" rx="2" fill="#8B5CF6" opacity="0.7" />
  <rect x="320" y="330" width="100" height="10" rx="2" fill="#8B5CF6" opacity="0.7" />
  
  <!-- People -->
  <!-- Person 1 -->
  <circle cx="200" cy="300" r="40" fill="#6D28D9" />
  <circle cx="200" cy="270" r="20" fill="#8B5CF6" />
  <rect x="180" y="310" width="40" height="60" rx="10" fill="#6D28D9" />
  
  <!-- Person 2 -->
  <circle cx="600" cy="300" r="40" fill="#4F46E5" />
  <circle cx="600" cy="270" r="20" fill="#818CF8" />
